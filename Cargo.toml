[package]
name = "netavark-sriov"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Netavark plugin that attaches one SR-IOV virtual function to a container network namespace"
readme = "README.md"
publish = false

[[bin]]
name = "sriov"
path = "src/main.rs"

[dependencies]
# Exact pin: the plugin types must match the netavark package this binary is built against.
netavark = "=2.1.0"
env_logger = "0.11"
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = ["fs", "sched"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
